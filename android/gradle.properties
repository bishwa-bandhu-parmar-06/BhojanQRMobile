# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Sized for a 7.6 GB machine. The previous -Xmx4096m -XX:MaxMetaspaceSize=1024m
# crashed the daemon outright ("Native memory allocation (malloc) failed",
# hs_err_pid2924.log): reserving 5 GB for the Java heap on a box with ~1 GB
# actually free leaves nothing for the NATIVE allocations the Kotlin compiler
# and dexer make, and the JVM dies rather than degrading. Lowering the ceiling
# is counter-intuitive but is exactly what the crash log recommends - the
# build needs native headroom far more than it needs heap.
# -XX:+UseSerialGC: the daemon crashed in a G1 GC thread (hs_err_pid21016.log,
# EXCEPTION_ACCESS_VIOLATION in GCTaskThread) with 419M of 7.8G physical free. G1 on
# 12 cores spawns ~10 GC threads, each with its own native stack and remembered-set
# structures. SerialGC uses one thread and far less native memory - on this box the
# collector overhead is what kills the build, not the heap size.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# One worker at a time. Parallel workers each fork their own JVM, which is the
# other way this build runs the machine out of memory.
org.gradle.workers.max=1
org.gradle.parallel=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
# Device (M2006C3LII) reports ro.product.cpu.abilist = armeabi-v7a,armeabi - it has
# NO arm64-v8a support, so building that ABI produced native libs the phone cannot
# load. That was ~half the CMake work and the most memory-hungry phase, on a box
# that crashed the daemon three times with <420M free. Restore the full list before
# shipping a release APK or testing on an arm64/x86 device or emulator.
reactNativeArchitectures=armeabi-v7a
# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# Compile Kotlin inside the Gradle daemon instead of forking a separate Kotlin
# daemon JVM (~700M-1G). One less JVM matters more than compile speed here.
kotlin.compiler.execution.strategy=in-process
# File-system watching holds native memory for the whole watched tree.
org.gradle.vfs.watch=false
